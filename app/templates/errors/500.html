{% extends "base.html" %}

{% block title %}Server Error - LegalDraft India{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        <h1 class="display-4 fw-bold mt-3">500</h1>
        <h3 class="text-muted">Something Went Wrong</h3>
        <p class="text-secondary mt-3">
            An unexpected error occurred. Please try again later.<br>
            If the problem persists, please contact support.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary">
                <i class="bi bi-house"></i> Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
