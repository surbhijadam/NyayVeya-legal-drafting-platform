{% extends "base.html" %}

{% block title %}Page Not Found - LegalDraft India{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="py-5">
        <i class="bi bi-file-earmark-x display-1 text-muted"></i>
        <h1 class="display-4 fw-bold mt-3">404</h1>
        <h3 class="text-muted">Page Not Found</h3>
        <p class="text-secondary mt-3">
            The page you are looking for does not exist or may have been moved.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary me-2">
                <i class="bi bi-house"></i> Go Home
            </a>
            <a href="{{ url_for('main.document_list') }}" class="btn btn-outline-secondary">
                Browse Documents
            </a>
        </div>
    </div>
</div>
{% endblock %}
